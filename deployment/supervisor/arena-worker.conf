; Arena Laravel queue worker — copy to /etc/supervisor/conf.d/arena-worker.conf
; Replace /path/to/tournament-backend and www-data with your server paths/user.

[program:arena-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /path/to/tournament-backend/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/path/to/tournament-backend/storage/logs/worker.log
stopwaitsecs=3600
